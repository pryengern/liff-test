<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>ติดต่อแอดมิน</title>
<style>
  :root { --bg: #0f0f0f; --card: #161823; --line: #2f3036; --fg: #fff; --muted: #a1a2a7; --primary: #fe2c55; --bad: #f87171; --cyan: #25f4ee; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 16px/1.6 "Noto Sans Thai", system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 0 20px 40px; }
  .hidden { display: none !important; }

  /* --- Step 1, in TikTok: point at the ⋯ menu in the top-right corner of TikTok's browser bar --- */
  #inTiktok { padding-top: 8px; }
  .arrow { position: relative; height: 150px; }
  .arrow svg { position: absolute; right: -4px; top: 0; width: 170px; height: 150px; }
  .arrow path { stroke: var(--fg); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .bounce { animation: bounce 1.2s ease-in-out infinite; transform-origin: top right; }
  @keyframes bounce { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(6px, -8px); } }
  @media (prefers-reduced-motion: reduce) { .bounce { animation: none; } }
  h1 { font-size: 24px; line-height: 1.35; margin: 4px 0 18px; }
  .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .steps li { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); display: grid; place-items: center; font-weight: 700; }
  .dots { display: inline-flex; gap: 4px; padding: 6px 10px; border-radius: 8px; background: #fff; vertical-align: middle; margin: 0 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #111; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 8px; background: #fff; color: #111; font-weight: 600; }
  .why { margin-top: 20px; color: var(--muted); font-size: 14px; }

  /* --- Step 2, in the phone's browser: email form (FLOW 13.7), then LIFF --- */
  #inBrowser { padding-top: 12vh; }
  .brand { font-size: 26px; font-weight: 800; letter-spacing: -.01em; text-align: center; }
  #inBrowser h1 { font-size: 20px; font-weight: 600; line-height: 1.45; text-align: center; margin: 22px 0; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; height: 54px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 17px; }
  input:focus { outline: none; border-color: var(--cyan); }
  input[aria-invalid="true"] { border-color: var(--bad); }
  .msg { min-height: 24px; margin-top: 6px; font-size: 14px; }
  .msg.bad { color: var(--bad); }
  .msg button { border: 0; background: none; color: var(--cyan); font: inherit; text-decoration: underline; padding: 0; }
  .go { width: 100%; height: 54px; margin-top: 10px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-size: 17px; font-weight: 700; }
  .go:disabled { opacity: .6; }
  .privacy { margin-top: 26px; text-align: center; color: var(--muted); font-size: 13px; }
  .privacy a { color: var(--muted); }
  .debug { margin-top: 28px; text-align: center; color: #6e6f75; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">

  <section id="inTiktok" class="hidden" aria-labelledby="t1">
    <div class="arrow" aria-hidden="true">
      <svg viewBox="0 0 170 150" class="bounce">
        <path d="M20 140 C 40 70, 90 40, 150 18" />
        <path d="M118 12 L 152 16 L 140 48" />
      </svg>
    </div>
    <h1 id="t1">อีกนิดเดียว ไปคุยกับแอดมินใน LINE</h1>
    <ol class="steps">
      <li><span class="num">1</span><span>กดปุ่ม <span class="dots" aria-label="จุดสามจุด"><i></i><i></i><i></i></span> ที่มุมขวาบน</span></li>
      <li><span class="num">2</span><span>เลือก <span class="pill">เปิดในเบราว์เซอร์</span></span></li>
    </ol>
    <p class="why">แอป TikTok ไม่อนุญาตให้เปิด LINE จากหน้านี้โดยตรง</p>
  </section>

  <section id="inBrowser" class="hidden" aria-labelledby="t2">
    <div class="brand">Bussay</div>
    <h1 id="t2">กรุณากรอกอีเมล<br>เพื่อใช้ติดต่อกับแอดมิน</h1>
    <form id="form" novalidate>
      <label for="email">อีเมลของคุณ</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com" required>
      <div class="msg" id="msg" aria-live="polite"></div>
      <button class="go" id="go" type="submit">ไปที่ LINE ›</button>
    </form>
    <p class="privacy">เราใช้อีเมลเพื่อติดต่อและตรวจสอบการสมัครเท่านั้น<br><a href="#" onclick="return false">นโยบายข้อมูลส่วนบุคคล ›</a></p>
  </section>

  <p class="debug" id="debug"></p>
</div>

<script>
  // Test page for FLOW 7 (stands in for stp-live.io/r/rt2345). No server yet: the real form POSTs
  // to kpi-api, which saves the email and returns the code s. Here we only validate and make a test s.
  const LIFF_ID = "2011949709-wBrlMLAD";
  const params = new URLSearchParams(location.search);
  const code = (params.get("r") || "rt2345").toUpperCase();
  const ua = navigator.userAgent;
  const inTikTok = /musical_ly|BytedanceWebview|TikTok|trill/i.test(ua);

  document.getElementById("debug").textContent =
    `ทดสอบ · ผู้ไลฟ์ ${code} · ${inTikTok ? "อยู่ใน TikTok" : "อยู่ใน browser ของเครื่อง"} · ยังไม่บันทึกอีเมลจริง`;

  if (inTikTok) {
    document.getElementById("inTiktok").classList.remove("hidden");
  } else {
    document.getElementById("inBrowser").classList.remove("hidden");
  }

  // ----- email form -----
  const TYPOS = { "gmial.com": "gmail.com", "gmai.com": "gmail.com", "gmal.com": "gmail.com", "gmail.co": "gmail.com",
                  "gnail.com": "gmail.com", "hotmial.com": "hotmail.com", "hotmai.com": "hotmail.com",
                  "hotmail.co": "hotmail.com", "yaho.com": "yahoo.com", "outlok.com": "outlook.com" };
  const email = document.getElementById("email");
  const msg = document.getElementById("msg");
  const valid = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

  function check(show) {
    const v = email.value.trim().toLowerCase();
    const domain = v.split("@")[1];
    msg.className = "msg";
    msg.textContent = "";
    email.removeAttribute("aria-invalid");
    if (domain && TYPOS[domain]) {
      const fixed = v.replace(/@.*/, "@" + TYPOS[domain]);
      msg.innerHTML = `หมายถึง <button type="button" id="fix">${fixed}</button> ใช่ไหม`;
      document.getElementById("fix").onclick = () => { email.value = fixed; check(false); email.focus(); };
      return true;
    }
    if (show && !valid(v)) {
      msg.className = "msg bad";
      msg.textContent = v ? "รูปแบบอีเมลไม่ถูกต้อง" : "กรุณากรอกอีเมล";
      email.setAttribute("aria-invalid", "true");
      return false;
    }
    return valid(v);
  }
  email.addEventListener("input", () => check(false));
  email.addEventListener("blur", () => { if (email.value) check(true); });

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!check(true)) { email.focus(); return; }
    const go = document.getElementById("go");
    go.disabled = true;
    go.textContent = "กำลังไปที่ LINE…";
    const s = "T" + Math.random().toString(36).slice(2, 8).toUpperCase(); // real s comes from kpi-api
    // The tap on "ไปที่ LINE" is a user gesture, so Android can hand this link straight to the LINE app.
    location.href = `https://liff.line.me/${LIFF_ID}?s=${s}`;
  });
</script>
</body>
</html>
